[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caideface"
version = "0.1.0"
description = "MRI defacing pipeline with skull-stripping and affine registration from cai4cai"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "cai4cai", email = "cai4cai@kcl.ac.uk"},
]
keywords = ["MRI", "defacing", "anonymisation", "skull-stripping", "neuroimaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "nibabel>=4.0",
    "numpy>=1.22",
    "scipy>=1.9",
    "SimpleITK>=2.2",
    "pandas>=1.5",
    "natsort>=8.0",
    "tqdm>=4.60",
    "hd-bet",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
caideface = "caideface.cli:main"

[project.urls]
Homepage = "https://github.com/cai4cai/caideface"
Repository = "https://github.com/cai4cai/caideface"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
caideface = ["data/*.nii.gz"]
